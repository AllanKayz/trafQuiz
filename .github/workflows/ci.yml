name: TRAFQUIZ 2.0 CI/CD Pipeline

on:
  push:
    branches: [ dev-executable, main, master ]
  pull_request:
    branches: [ dev-executable, main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          NODE_ENV: test
        run: node tests/integration/run-tests.js

      - name: Build Angular Frontend
        run: npm run build

      - name: Validate Electron Package Setup
        run: npx electron-builder --help || echo "Electron Builder Ready"
