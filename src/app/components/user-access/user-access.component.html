<div class="user-access-container fade-in">

    <app-sectionheader [header]="header" [content]="content" [buttons]="buttons()"
        (buttonClicked)="openAddUserDialog(addUserTemplate)" />

    <section class="widgets-grid">
        @for (widget of widgets(); track widget.title) {
        <app-stat-card [title]="widget.title" [data]="widget.data" [footer]="widget.footer" />
        }
    </section>

    <section class="questions-table pt-3">
        <app-table [columns]="tableColumns()" [data]="tableData()" [actions]="['edit', 'delete']"
            [filterPlaceholder]="'Search users...'"
            (rowAction)="$event.action === 'edit' ? openPasswordDialog($event.item, passwordTemplate) : handleTableAction($event)"></app-table>
    </section>


</div>

<!-- Add User Dialog Template -->
<ng-template #addUserTemplate>
    <div class="dialog-container">
        <h2 mat-dialog-title>Add New User</h2>
        <form #userForm="ngForm" (ngSubmit)="onUserAdded(dialog.openDialogs[0], userForm)">
            <mat-dialog-content class="dialog-content">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>First Name</mat-label>
                    <input matInput name="firstName" ngModel required placeholder="First Name">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Last Name</mat-label>
                    <input matInput name="lastName" ngModel required placeholder="Last Name">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput name="email" ngModel required email placeholder="Email Address">
                </mat-form-field>
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Role</mat-label>
                    <mat-select name="role" ngModel required>
                        <mat-option value="student">Student</mat-option>
                        <mat-option value="instructor">Instructor</mat-option>
                    </mat-select>
                </mat-form-field>
            </mat-dialog-content>
            <mat-dialog-actions align="end">
                <button mat-button mat-dialog-close type="button">Cancel</button>
                <button mat-flat-button color="primary" type="submit" [disabled]="!userForm.valid">Create User</button>
            </mat-dialog-actions>
        </form>
    </div>
</ng-template>

<!-- Password Dialog Template -->
<ng-template #passwordTemplate let-data>
    <div class="dialog-container">
        <h2 mat-dialog-title>Reset Password for {{data.name}}</h2>
        <div class="dialog-content">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>New Password</mat-label>
                <input matInput #newPass type="text" placeholder="Enter new password">
            </mat-form-field>
        </div>
        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cancel</button>
            <button mat-flat-button color="primary"
                (click)="onPasswordChanged(dialog.openDialogs[0], data.id, newPass.value)">Save</button>
        </mat-dialog-actions>
    </div>
</ng-template>
