<div class="widgets-container fade-in">

  <!-- Welcome Section -->
  <div class="welcome-header">
    <h2>Welcome back, <span class="highlight">{{ userName() }}</span>!</h2>
    <p>Here's what's happening today.</p>
  </div>

  <!-- Quick Actions Grid -->
  <section class="quick-actions">
    <div class="section-title">Quick Actions</div>
    <div class="actions-grid">
      @for (action of quickActions(); track action.label) {
      <div (click)="handleAction(action)" matRipple class="action-card">
        <div class="action-icon">
          <mat-icon>{{ action.icon }}</mat-icon>
        </div>
        <span class="action-label">{{ action.label }}</span>
      </div>
      }
    </div>
  </section>

  <!-- Key Stats Grid -->
  <section class="stats-section">
    <div class="section-title">Overview</div>
    <div class="stats-grid">
      @for (widget of widgets(); track widget.title) {
      <app-stat-card [title]="widget.title" [data]="widget.data" [footer]="widget.footer" [isLoading]="isLoading()">
      </app-stat-card>
      }
    </div>
  </section>

</div>
