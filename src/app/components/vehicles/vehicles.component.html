<div class="vehicles-container fade-in">
  <header class="page-header">
    <div class="header-content">
      <h1>Vehicle Fleet Management</h1>
      <p>Monitor and manage company vehicles and maintenance status.</p>
    </div>
    <div class="header-actions">
      @if (isAdmin()) {
      <button mat-flat-button color="primary" (click)="openAdd()">
        <mat-icon>add_directions_car</mat-icon>
        Add Vehicle
      </button>
      }
      <button mat-icon-button (click)="load()" [disabled]="loading" matTooltip="Refresh Data">
        <mat-icon [class.rotating]="loading">refresh</mat-icon>
      </button>
    </div>
  </header>

  @if (error) {
  <div class="error-banner">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
  </div>
  }

  <section class="questions-table pt-3">
    <app-table [columns]="tableColumns()" [data]="tableData()" [actions]="tableActions()"
      [filterPlaceholder]="'Search vehicle...'" (rowAction)="handleTableAction($event)"></app-table>
  </section>
</div>
