<div class="vehicles-container fade-in">
  <app-sectionheader [header]="header" [content]="content" [buttons]="buttons()"
    (buttonClicked)="handleButtonAction($event)" />

  <section class="widgets-grid">
    @for (widget of widgets(); track widget.title) {
    <app-stat-card
      [title]="widget.title"
      [data]="widget.data"
      [footer]="widget.footer"
      [icon]="widget.icon"
      [isLoading]="loading" />
    }
  </section>

  <section class="charts-section animate-slide-up" *ngIf="!loading || tableData().length > 0">
    <mat-card class="chart-card premium-shadow">
      <mat-card-header>
        <mat-icon mat-card-avatar class="chart-icon">pie_chart</mat-icon>
        <mat-card-title>Fleet Status Overview</mat-card-title>
        <mat-card-subtitle>Current distribution of vehicle conditions</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <div class="chart-container">
          <canvas baseChart
            [data]="chartData()"
            [options]="chartOptions"
            [type]="'doughnut'">
          </canvas>
          <div class="chart-center-label">
            <span class="total-count">{{ tableData().length }}</span>
            <span class="total-text">Vehicles</span>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </section>

  @if (error) {
  <div class="error-banner">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
  </div>
  }

  <section class="questions-table pt-3">
    <app-table [columns]="tableColumns()" [data]="tableData()" [actions]="tableActions()" [isLoading]="loading"
      [filterPlaceholder]="'Search vehicle...'" (rowAction)="handleTableAction($event)"></app-table>
  </section>
</div>
