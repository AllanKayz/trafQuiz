<div class="vehicles-container fade-in">
  <app-sectionheader [header]="header" [content]="content" [buttons]="buttons()"
    (buttonClicked)="handleButtonAction($event)" />

  <section class="widgets-grid">
    <div class="stats-cards">
      @for (widget of widgets(); track widget.title) {
      <app-stat-card [title]="widget.title" [data]="widget.data" [footer]="widget.footer" [isLoading]="loading" />
      }
    </div>
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Fleet Status</mat-card-title>
      </mat-card-header>
      <mat-card-content style="height: 180px;">
        @if (loading) {
          <app-skeleton-loader height="100%"></app-skeleton-loader>
        } @else {
          <canvas baseChart
            [data]="chartData()"
            [options]="chartOptions"
            [type]="'doughnut'">
          </canvas>
        }
      </mat-card-content>
    </mat-card>
  </section>

  @if (error) {
  <div class="error-banner">
    <mat-icon>error_outline</mat-icon>
    <span>{{ error }}</span>
  </div>
  }

  <section class="questions-table pt-3">
    <app-table [columns]="tableColumns()" [data]="tableData()" [actions]="tableActions()" [isLoading]="loading"
      [filterPlaceholder]="'Search vehicle...'" (rowAction)="handleTableAction($event)"></app-table>
  </section>
</div>
