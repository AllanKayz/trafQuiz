<div class="sidenav-container">

  <!-- Sidebar -->
  <aside class="sidenav" [class.collapsed]="isSidenavCollapsed()">
    <div class="sidebar-header">
      <button class="toggle-btn" (click)="toggleSidenav()">
        <mat-icon>{{isSidenavCollapsed() ? 'menu' : 'menu_open'}}</mat-icon>
      </button>
    </div>

    @if (isLoggedIn()) {
    <nav class="nav-list">
      @for (item of menuItems(); track item) {
      <a class="nav-item" [routerLink]="[item.toLowerCase()]" routerLinkActive="active-link"
        [routerLinkActiveOptions]="{exact: false}">
        <mat-icon>{{icons()[item.toLowerCase()] || 'circle'}}</mat-icon>
        @if (!isSidenavCollapsed()) {
        <span>{{item}}</span>
        }
      </a>
      }
    </nav>
    }
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-scroll">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
