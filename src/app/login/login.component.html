<div class="login-container">
  <!-- Brand Section -->
  <aside class="brand-section">
    <div class="brand-content">
      <h1>TrafQuiz</h1>
      <p>The smartest path to mastering your driving theory. Log in to track your progress and ace your tests.</p>
    </div>
  </aside>

  <!-- Form Section -->
  <div class="form-section">
    <div class="login-card">
      <div class="login-header">
        <img class="logo-img" src="assets/logo.png" alt="TrafQuiz Logo">
        <h2>Welcome back</h2>
        <p>Please enter your details to sign in.</p>
      </div>

      <form [formGroup]="loginForm" (submit)="login()">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" type="text" required placeholder="Enter your username">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hide ? 'password' : 'text'" required
            placeholder="Enter your password">
          <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button" tabindex="-1">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" class="login-btn" [disabled]="isLoading()">
            @if (isLoading()) {
            <mat-progress-spinner mode="indeterminate" diameter="24" color="accent"></mat-progress-spinner>
            } @else {
            Sign in
            }
          </button>
        </div>

        <div class="helper-links">
          <a href="#">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
</div>
